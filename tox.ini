[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist = py{313,314,315}-django{520,600,610}

[testenv]
runner = uv-venv-runner
dependency_groups = dev
allowlist_externals =
    bash
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
setenv =
    PYTHONWARNINGS = d
commands =
    mypy django_sns_view
    coverage run \
        manage.py test \
            django_sns_view \
            -v 2 \
            --buffer
    coverage report
    coverage xml
